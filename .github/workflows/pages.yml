name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Publish the website only. The working notes (*.md, PROMPTS, AUDIT,
      # scripts, package files) and the internal components.html catalogue
      # stay in the repo but are not served at the public link.
      - name: Collect the website files
        run: |
          mkdir _site
          cp -R *.html nav.js assets styles en shop _site/
          rm _site/components.html

      - name: Upload the website as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
